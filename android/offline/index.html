<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/offline.css"><script src="/rich.js" defer></script><script src="/offline.js" defer></script><title>오프라인 책장</title></head><body><header id="offline-head"><h2 id="offline-title">보관한 이야기</h2><p id="offline-date" class="help"></p><details><summary>읽기 도구</summary><div class="settings-grid"><label>테마<select id="off-theme"><option value="light">화이트</option><option value="cream">크림</option><option value="rose">로즈</option><option value="sage">세이지</option><option value="cocoa">밤서재</option><option value="dark">잉크</option></select></label><label>글꼴<select id="off-font"><option value="system">기기 기본</option><option value="gothic">나눔고딕</option><option value="myeongjo">나눔명조</option><option value="batang">고운바탕</option><option value="ridi">리디바탕</option></select></label><label>줄 간격<select id="off-line"><option value="1.5">좁게</option><option value="1.85">기본</option><option value="2.2">넓게</option></select></label><label>여백<select id="off-padding"><option value="12">좁게</option><option value="24">기본</option><option value="36">넓게</option></select></label><label>글자 크기<select id="off-size"><option>15</option><option>16</option><option>18</option><option>20</option></select></label><label><input id="off-bold" type="checkbox">굵게 읽기</label></div><label><input id="off-photos" type="checkbox" checked>대화 속 캐릭터 프사 표시</label><label>저장 당시 책갈피<select id="off-marks"><option value="">책갈피 선택</option></select></label></details><button id="off-focus">집중 읽기</button></header><div id="offline-transcript" tabindex="0"></div><footer id="offline-footer"><button id="off-first">처음으로 ↑</button><button id="off-prev">이전</button><span id="off-page"></span><button id="off-next">다음</button><button id="off-last">최신으로 ↓</button></footer><button id="off-exit" hidden>메뉴 보기</button></body></html>

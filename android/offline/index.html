<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>실리 책방 · 오프라인</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./offline.css"><script src="./rich.js" defer></script><script src="./offline.js" defer></script><script src="./pickers.js" defer></script></head>
<body><header class="top" id="offline-head"><div class="brand-row"><div><h1>실리 책방</h1><p>우리 이야기가 꽂히는 곳</p></div></div><div class="top-actions"><button id="off-home">홈화면</button><button id="off-tools">도구</button><button id="off-lock">잠그기</button></div></header>
<section class="chat-head" id="offline-chat-head"><div class="heading"><p class="eyebrow" id="offline-person"></p><h2 id="offline-title">보관한 이야기</h2></div><div class="reading-tools"><button id="off-alias">별명</button><button id="off-search">내용 찾기</button><button id="off-refresh" disabled title="보관본은 자동 갱신되지 않아요. 서버 연결 후 온라인 책방에서 다시 보관해 주세요.">대화 갱신</button><button id="off-marks">책갈피</button><button id="off-focus">집중</button><button id="off-font-size">가 16</button></div></section>
<div id="offline-transcript" tabindex="0" aria-label="저장한 대화"></div>
<footer id="offline-footer"><span id="off-status" role="status">오프라인 보관본</span><button id="off-first">처음으로 ↑</button><button id="off-last">최신으로 ↓</button></footer><button id="off-exit" hidden>메뉴 보기</button>
<dialog id="off-settings"><div class="dialog-head"><h2>도구</h2><button data-close aria-label="닫기">×</button></div><div class="settings-grid"><label>테마<select id="off-theme"><option value="light">화이트</option><option value="cream">크림</option><option value="rose">로즈</option><option value="sage">세이지</option><option value="cocoa">밤서재</option><option value="dark">잉크</option></select></label><label>글꼴<select id="off-font"><option value="system">기본 글꼴</option><optgroup label="고딕 · 돋움"><option value="pretendard">프리텐다드</option><option value="plex">IBM Plex Sans KR</option><option value="gothic">나눔고딕</option><option value="dodum">고운돋움</option></optgroup><optgroup label="바탕 · 명조"><option value="ridi">리디바탕</option><option value="myeongjo">나눔명조</option><option value="batang">고운바탕</option><option value="hahmlet">함렛</option></optgroup></select></label><label>줄 간격<select id="off-line"><option value="1.5">좁게</option><option value="1.85">기본</option><option value="2.2">넓게</option></select></label><label>여백<select id="off-padding"><option value="12">좁게</option><option value="24">기본</option><option value="36">넓게</option></select></label><label>글자 크기<select id="off-size"><option>15</option><option>16</option><option>18</option><option>20</option></select></label><label><input id="off-bold" type="checkbox">굵게 읽기</label></div><label><input id="off-photos" type="checkbox" checked>대화 속 캐릭터 프사 표시</label><p class="help" id="offline-date"></p><p class="help">서버 연결 후 온라인 책방에서 다시 보관하면 대화를 갱신할 수 있어요.</p></dialog>
<dialog id="off-alias-dialog"><div class="dialog-head"><h2>대화 별명</h2><button data-close aria-label="닫기">×</button></div><p class="help">이 기기의 보관본에만 적용돼요. 실리 원본과 온라인 책방은 바뀌지 않아요.</p><form id="off-alias-form"><label>별명<input id="off-alias-input" maxlength="120" autocomplete="off"></label><div class="dialog-actions"><button type="submit" class="primary">저장</button><button type="button" data-close>취소</button></div><p role="status"></p></form></dialog>
<dialog id="off-search-dialog"><div class="dialog-head"><h2>내용 찾기</h2><button data-close aria-label="닫기">×</button></div><form id="off-search-form"><label>검색어<input id="off-query" maxlength="200" autocomplete="off" placeholder="저장된 대화와 번역에서 찾기"></label><button type="submit" class="primary">찾기</button></form><p id="off-search-status" class="help" role="status"></p><div id="off-search-results"></div></dialog>
<dialog id="off-bookmarks"><div class="dialog-head"><h2>책갈피</h2><button data-close aria-label="닫기">×</button></div><p class="help">이 기기에 저장돼요. 메시지 옆 ☆을 누르면 책갈피를 남길 수 있어요.</p><div id="off-bookmark-list"></div></dialog>
<dialog id="off-mark-dialog"><div class="dialog-head"><h2>책갈피</h2><button data-close aria-label="닫기">×</button></div><form id="off-mark-form"><label>메모<textarea id="off-note" maxlength="500" rows="3" placeholder="기억하고 싶은 장면"></textarea></label><div class="dialog-actions"><button class="primary" type="submit">저장</button><button id="off-remove-mark" type="button">삭제</button><button type="button" data-close>취소</button></div><p role="status"></p></form></dialog>
</body></html>

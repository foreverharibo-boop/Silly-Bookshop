<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>실리 책방</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css?v=0.5.0-test.1"><script src="./rich.js?v=0.5.0-test.1" defer></script><script src="./app.js?v=0.5.0-test.1" defer></script></head>
<body>
<section id="gate" class="gate"><div class="gate-card"><img src="./icon.svg" width="64" height="64" alt=""><p class="eyebrow">A LITTLE PLACE FOR OUR STORIES</p><h1>실리 책방</h1><p class="subtitle">우리 이야기가 꽂히는 곳</p><form id="login-form"><label for="password">책방 비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="256" required placeholder="비밀번호를 입력해 주세요"><button class="primary" type="submit">서재 열기 <span aria-hidden="true">→</span></button></form><p id="gate-status" role="status">책방에 연결하고 있어요.</p><a href="/" id="silly-login">실리 로그인 화면 열기</a><small>채팅 원본은 그대로, 읽기는 편안하게.</small></div></section>
<div id="library" hidden>
<header class="top"><div class="brand-row"><button id="fold" class="icon-btn" aria-label="목록 접기" aria-controls="sidebar" aria-expanded="true">☰</button><img src="./icon.svg" width="30" height="30" alt=""><div><h1>실리 책방</h1><p>우리 이야기가 꽂히는 곳</p></div></div><div class="top-actions"><select id="theme" title="책방 테마" aria-label="책방 테마"><option value="light">화이트</option><option value="cream">크림</option><option value="rose">로즈</option><option value="sage">세이지</option><option value="cocoa">밤서재</option><option value="dark">잉크</option></select><button id="lock">잠그기</button></div></header>
<div class="layout"><aside id="sidebar"><div class="search-wrap"><input type="search" id="search" placeholder="캐릭터 · 대화 찾기" aria-label="캐릭터와 대화 검색"></div><p class="section-label">책장 <span id="count"></span></p><nav id="characters" aria-label="캐릭터 목록"></nav><p class="sidebar-foot">저장된 대화 · 자동 업데이트<br><span id="app-version">화면 0.5.0</span></p></aside>
<main><div class="chat-head"><div class="heading"><p id="person" class="eyebrow">나만의 작은 책방</p><h2 id="title">어떤 이야기를 펼쳐볼까요?</h2></div><div class="reading-tools"><button id="refresh" title="사진과 대화 다시 불러오기">새로고침</button><button id="font-size" title="글자 크기 바꾸기">가＋</button></div></div><div id="transcript" tabindex="0" aria-label="대화 읽기"><div class="empty"><span>⌑</span><h3>이야기가 기다리고 있어요</h3><p>왼쪽 책장에서 대화를 골라 주세요.</p></div></div><footer><span id="status" role="status">읽던 위치는 기기 사이에서도 이어져요.</span><button id="first" hidden>처음으로 ↑</button><button id="latest" hidden>최신으로 ↓</button></footer></main></div></div>
</body></html>

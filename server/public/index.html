<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>실리 책방</title><link rel="icon" href="./icon.svg" type="image/svg+xml"><link rel="stylesheet" href="./style.css"><script src="./vendor/purify.min.js" defer></script><script src="./vendor/showdown.min.js" defer></script><script src="./rich.js" defer></script><script src="./app.js" defer></script></head>
<body>
<section id="gate" class="gate"><div class="gate-card"><img src="./icon.svg" width="64" height="64" alt=""><p class="eyebrow">A LITTLE PLACE FOR OUR STORIES</p><h1>실리 책방</h1><p class="subtitle">우리 이야기가 꽂히는 곳</p><form id="login-form"><label for="password">책방 비밀번호</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="256" required placeholder="비밀번호를 입력해 주세요"><button class="primary" type="submit">서재 열기 <span aria-hidden="true">→</span></button></form><p id="gate-status" role="status">책방에 연결하고 있어요.</p><a href="/" id="sili-login">실리 로그인 화면 열기</a><small>채팅 원본은 그대로, 읽기는 편안하게.</small></div></section>
<div id="library" hidden>
<header class="top"><div class="brand-row"><button id="fold" class="icon-btn" aria-label="목록 접기" aria-controls="sidebar" aria-expanded="true">☰</button><img src="./icon.svg" width="30" height="30" alt=""><div><h1>실리 책방</h1><p>우리 이야기가 꽂히는 곳</p></div></div><div class="top-actions"><button id="theme" title="화면 테마 바꾸기" aria-label="화면 테마 바꾸기">◐</button><button id="lock">잠그기</button></div></header>
<div class="layout"><aside id="sidebar"><div class="search-wrap"><input type="search" id="search" placeholder="캐릭터 · 대화 찾기" aria-label="캐릭터와 대화 검색"></div><p class="section-label">책장 <span id="count"></span></p><nav id="characters" aria-label="캐릭터 목록"></nav><p class="sidebar-foot">실리 채팅 · 읽기 전용</p></aside>
<main><div class="chat-head"><div class="heading"><p id="person" class="eyebrow">나만의 작은 책방</p><h2 id="title">어떤 이야기를 펼쳐볼까요?</h2></div><div class="reading-tools"><button id="display-mode" title="모두 보기 → 실리 화면 → 원문 전환">모두 보기</button><button id="font-size" title="글자 크기 바꾸기">가＋</button></div></div><div id="transcript" tabindex="0" aria-label="대화 읽기"><div class="empty"><span>⌑</span><h3>이야기가 기다리고 있어요</h3><p>왼쪽 책장에서 대화를 골라 주세요.</p></div></div><footer><span id="status" role="status">읽던 위치는 기기 사이에서도 이어져요.</span><button id="latest" hidden>최신으로 ↓</button></footer></main></div></div>
</body></html>
